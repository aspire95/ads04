<div class="page">
  <div class="small-container card">
    <h2>MCQ Portal Login</h2>
    <p class="muted">Enter your username and password.</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="form">
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="credentials.username"
          required
          placeholder="Username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="credentials.password"
          required
          placeholder="Password">
      </div>

      <div *ngIf="error" class="error">{{ error }}</div>

      <button type="submit" [disabled]="!loginForm.valid" class="button">Login</button>
      <p class="muted">New user? <a routerLink="/register">Register here</a></p>
    </form>
  </div>
</div>
