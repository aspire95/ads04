<div class="page">
  <div class="small-container card">
    <h2>Create Account</h2>
    <p class="muted">Register as a student or teacher.</p>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="form">
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="user.username"
          required
          placeholder="Choose username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="user.password"
          required
          minlength="4"
          placeholder="Choose password">
      </div>

      <div class="field">
        <label for="role">Role</label>
        <select id="role" name="role" [(ngModel)]="user.role">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>

      <div *ngIf="error" class="error">{{ error }}</div>

      <button type="submit" [disabled]="!registerForm.valid" class="button">Register</button>
      <p class="muted">Already registered? <a routerLink="/login">Login here</a></p>
    </form>
  </div>
</div>
