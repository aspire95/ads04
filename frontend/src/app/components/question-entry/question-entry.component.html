<div class="page">
  <div class="container">
    <div class="header">
      <div>
        <a routerLink="/dashboard">Back to Dashboard</a>
        <h2>Manage Questions</h2>
        <p class="muted">Exam ID: {{ examId }}</p>
      </div>
    </div>

    <div class="grid grid-2">
      <section class="card">
        <h3>Add Question</h3>
        <form (ngSubmit)="onSubmit()" class="form">
          <div class="field">
            <label>Question</label>
            <textarea [(ngModel)]="newQuestion.question_text" name="text" required rows="3"></textarea>
          </div>

          <div class="field">
            <label>Image URL (optional)</label>
            <input [(ngModel)]="newQuestion.image_url" name="image" type="text">
          </div>

          <div class="grid">
            <label *ngFor="let opt of newQuestion.options; let i = index" class="option">
              <input type="radio" name="correct" [value]="opt.id" [(ngModel)]="newQuestion.correct_option">
              <span>{{ opt.id | uppercase }}</span>
              <input type="text" [(ngModel)]="opt.text" name="opt-{{i}}" required placeholder="Option text">
            </label>
          </div>

          <button type="submit" class="button">Add Question</button>
        </form>
      </section>

      <section class="card">
        <h3>Questions ({{ questions.length }})</h3>
        <div class="grid">
          <div *ngFor="let q of questions; let idx = index" class="card">
            <p><strong>{{ idx + 1 }}. {{ q.question_text }}</strong></p>
            <img *ngIf="q.image_url" [src]="q.image_url" alt="Question image" style="max-width: 100%; max-height: 220px;">

            <div class="grid">
              <div
                *ngFor="let opt of q.options"
                class="option"
                [ngClass]="opt.id === q.correct_option ? 'correct' : ''">
                <strong>{{ opt.id | uppercase }}.</strong>
                <span>{{ opt.text }}</span>
              </div>
            </div>
          </div>

          <p *ngIf="questions.length === 0" class="muted">No questions added yet.</p>
        </div>
      </section>
    </div>
  </div>
</div>
